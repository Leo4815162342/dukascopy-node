name: build
on:
  - push
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-
      - uses: pnpm/action-setup@v2.1.0
        with:
          version: 10.16.1
          run_install: true
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      - name: Install matching Chromium
        run: node dist/cli/index.js --install-browser ${{ runner.os == 'Linux' && '--with-deps' || '' }}
      - name: Verify headless browser launch
        run: node examples/with-headless-waf/browser-smoke.cjs
      - name: Verify ESM browser setup entry
        run: node dist/esm/cli/index.js --install-browser
